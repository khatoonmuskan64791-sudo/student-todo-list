<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STUDENT PRODUCTIVITY</p>
      <h1>My To-Do List ✨</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="Add an assignment or task..." maxlength="160" required>
      <button type="submit">Add task</button>
    </form>

    <section class="toolbar" aria-label="Task filters">
      <span id="task-count">0 tasks remaining</span>
      <div class="filters">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Pending</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>
    </section>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty-message" class="empty-message">You're all caught up! Add your first task above. 🎉</p>

    <footer>
      <button id="clear-completed" class="clear-button" type="button">Clear completed</button>
      <p>Your tasks are saved in this browser.</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
